name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (domain layer)
        run: npx vitest run

      - name: Expo config / dependency sanity check
        run: npx expo-doctor

      - name: Web bundle smoke test
        run: npx expo export --platform web
